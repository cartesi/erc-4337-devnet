[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.15"
evm_version = "london"
use_literal_content = true
optimizer = true
optimizer_runs = 1000000
libraries = []
allow_paths = ["../../../internal"]
fs_permissions = [
    { access = "read-write", path = "deployments" },
    { access = "read", path = "../../entrypoint/0.6/deployments" },
    { access = "read", path = "out" },
]
